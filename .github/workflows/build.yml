name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            target: portable
          - os: macos-latest
            platform: mac
            arch: arm64
            target: dmg
          - os: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: QuietReader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: QuietReader/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install jieba==0.42.1 pyinstaller==6.19.0
      - run: python scripts/build_analyzer.py
      - run: node test/runtime.cjs
      - run: npm test
      - run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: QuietReader-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            QuietReader/release/*.exe
            QuietReader/release/*.dmg
      - name: Upload release packages
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.exe release/*.dmg)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
