<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#212121" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="静读，属于你的随身书房。离线阅读与跨设备同步。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./app.css" /><link rel="stylesheet" href="./analytics.css" />
    <title>静读 · Quiet Reader</title>
  </head>
  <body data-ui="dark">
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="panel">
      <header>
        <h2 id="panel-title"></h2>
        <button id="panel-close" aria-label="关闭面板">关闭</button>
      </header>
      <div id="panel-body"></div>
    </dialog>
    <button id="update" hidden>新版本已就绪 · 更新</button>
    <script type="module" src="./app.js"></script>
  </body>
</html>
